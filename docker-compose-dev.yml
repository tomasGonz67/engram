services:
  backend:
    build: ./backend
    image: masi-memory-be:dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - hf_cache:/root/.cache/huggingface
    environment:
      ENVIRONMENT: development
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: masi_memory_user
      POSTGRES_PASSWORD: masi_memory_pass
      POSTGRES_DB: masi_memory_db
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ADMIN_BYPASS_TOKEN: ${ADMIN_BYPASS_TOKEN}
    depends_on:
      - qdrant
      - postgres

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: masi_memory_user
      POSTGRES_PASSWORD: masi_memory_pass
      POSTGRES_DB: masi_memory_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  qdrant_data:
  postgres_data:
  hf_cache:
